name: Build EmuCap Android APK
on:
  push:
    branches: [dev]
    paths:
      - 'tools/advanced_adventure_capture.py'
      - 'tools/advanced_adventure_capture_sequence.json'
      - 'tools/android_project/**'
      - '.github/workflows/emucap_android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already has Android SDK command-line tools.
      # setup-android@v3 currently requests the removed legacy 'tools' package.
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;22.1.7171670" "cmake;3.18.1"
      - name: Verify capture helper syntax
        run: python3 -m py_compile tools/advanced_adventure_capture.py
      - name: Assemble Android release APK
        working-directory: tools/android_project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuCap-Android-APK
          path: tools/android_project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
